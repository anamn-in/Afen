services:
  afen-app:
    build:
      context: ..
      dockerfile: configs/Dockerfile
    image: ghcr.io/anamnadmin/afen:latest
    container_name: afen-app
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - AFEN_PORT=8787
    restart: unless-stopped