[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "afen"
version = "1.0.2"
description = "Afen Python SDK - capture and send runtime errors to Afen"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Afen Contributors"}]
keywords = ["afen", "debugging", "error-tracking", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["requests>=2.28.0"]
[project.urls]
Homepage = "https://github.com/v-1908/afen"
Repository = "https://github.com/v-1908/afen"
Issues = "https://github.com/v-1908/afen/issues"
[project.scripts]
afen = "afen.cli:main"
[tool.setuptools]
packages = ["afen"]


